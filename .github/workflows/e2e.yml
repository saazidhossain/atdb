name: E2E (Playwright)

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: e2e-${{ github.ref }}
  cancel-in-progress: true

jobs:
  playwright:
    name: Playwright suite
    runs-on: ubuntu-latest
    timeout-minutes: 30

    # Official Playwright image — ships Chromium, Firefox, WebKit and ALL
    # required system libraries (libglib, libnss, libwebkit, etc.) so we
    # never have to run `playwright install-deps` ourselves.
    container:
      image: mcr.microsoft.com/playwright:v1.59.1-jammy
      # Run as root so `playwright install-deps` (apt-get) can succeed
      # even on runners/images where the default user lacks sudo.
      options: --user 0

    env:
      CI: "true"
      BASE_URL: http://127.0.0.1:4173
      # Per-suite retry budgets. Smoke is strict (catches real regressions
      # fast); full absorbs more transient flake. Bump either here without
      # touching code.
      PW_SMOKE_RETRIES: "1"
      PW_FULL_RETRIES: "2"

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Install Playwright browsers + system deps
        # Defensive: the official Playwright image already ships browsers
        # and shared libraries, but running this guarantees the suite
        # never fails with "error while loading shared libraries"
        # (libglib-2.0, libnss3, libwebkit, …) if the image drifts from
        # the pinned @playwright/test version, or if a contributor swaps
        # in a slimmer base image. `install --with-deps` is idempotent.
        run: npx playwright install --with-deps

      - name: Build app
        run: npm run build

      - name: Start preview server
        run: |
          npx vite preview --host 127.0.0.1 --port 4173 --strictPort &
          echo $! > .vite-preview.pid
          # Wait until the server actually responds (max 60s)
          for i in $(seq 1 60); do
            if curl -sfo /dev/null "$BASE_URL"; then
              echo "Preview server is up"
              exit 0
            fi
            sleep 1
          done
          echo "Preview server failed to start" >&2
          exit 1

      # ── Smoke lane ────────────────────────────────────────────────────
      # Runs first. Fails the job immediately if any @smoke spec breaks,
      # so contributors get a red signal in ~2 min instead of ~15. The
      # full lane is skipped on smoke failure (default step ordering).
      - name: Run smoke E2E (fail-fast, strict retries)
        id: smoke
        env:
          SUITE: smoke
        run: npm run test:e2e:smoke

      # ── Full lane ─────────────────────────────────────────────────────
      # Only runs when smoke passed. Lenient retries absorb transient
      # flake in the long visual-regression / a11y suites without going
      # red. Reuses the same SUITE / @smoke convention as the npm scripts.
      - name: Run full E2E (lenient retries)
        if: success() && steps.smoke.conclusion == 'success'
        env:
          SUITE: full
        run: npm run test:e2e:full

      - name: Stop preview server
        if: always()
        run: |
          if [ -f .vite-preview.pid ]; then
            kill "$(cat .vite-preview.pid)" 2>/dev/null || true
          fi

      - name: Upload Playwright HTML report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report
          retention-days: 14

      - name: Upload failure traces / screenshots
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-test-results
          path: test-results
          retention-days: 14